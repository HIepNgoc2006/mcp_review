name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify release tag points to main
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main --tags
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must reference a commit reachable from main.' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked dependencies
        run: |
          uv venv --python 3.13 .venv
          uv pip sync --require-hashes --python .venv/Scripts/python.exe requirements-mcp.lock
      - name: Build, test and smoke executable
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BridgeMCP-release
          path: |
            BridgeMCP-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BridgeMCP-release
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            BridgeMCP-windows-x64.zip
            SHA256SUMS.txt
